<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Self-Balancing Robot</title>
  <desc id="desc">A modern dark banner with a stylized two-wheel balancing robot and PID control graph.</desc>
